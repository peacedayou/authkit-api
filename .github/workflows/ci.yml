name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/AuthKit.Api.Tests/AuthKit.Api.Tests.csproj --logger "console;verbosity=normal"
      - name: Paquets vulnérables
        run: dotnet list src/AuthKit.Api/AuthKit.Api.csproj package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt
