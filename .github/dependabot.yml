# Mises a jour automatiques : mensuelles, groupees, peu de bruit.
# Les alertes de securite (Dependabot security updates) passent en plus, des qu'une faille est publiee.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github_actions:
        patterns: ["*"]
